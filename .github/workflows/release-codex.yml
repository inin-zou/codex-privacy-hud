name: Release patched Codex

on:
  push:
    tags: ["codex-*-hud*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive Codex version from tag
        id: ver
        run: echo "ver=$(echo '${{ github.ref_name }}' | sed -E 's/^codex-([0-9.]+)-hud.*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.95.0, targets: "${{ matrix.target }}" }
      # Clone before the cache step, not after: rust-cache keys on the
      # Cargo.lock inside the workspace it is pointed at, and until this
      # runs that directory does not exist -- so the cache silently fell
      # back to a lockfile-less key and every build was a cold one.
      # build-patched-codex.sh reuses a clean existing --src, so cloning
      # here costs nothing twice.
      - name: Clone Codex at the tag the build will use
        run: git clone --depth 1 --branch "rust-v${{ steps.ver.outputs.ver }}" https://github.com/openai/codex "${{ runner.temp }}/codex-src"
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "${{ runner.temp }}/codex-src/codex-rs" }
      - name: Build
        run: scripts/build-patched-codex.sh "${{ steps.ver.outputs.ver }}" --target "${{ matrix.target }}" --out dist --src "${{ runner.temp }}/codex-src"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-privacy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to this tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: false
      - name: Also publish under the rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/*
