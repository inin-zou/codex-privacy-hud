name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repo. The commit-message job only reads history.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Job names are the status-check names. Spelling the matrix leg into the
    # name explicitly means adding a matrix dimension later cannot silently
    # rename a required check.
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject and 3.12 is what development
        # happens on, but neither is what hooks/handler.py actually runs under
        # in production: a hook is invoked through its `#!/usr/bin/env python3`
        # shebang, which resolves to whatever python3 is first on the host's
        # PATH -- 3.14.7 on the maintainer's machine. That file is on the hot
        # path of every tool call and is stdlib-only by constitution
        # (CLAUDE.md section 4), so the newest interpreters are not a
        # nice-to-have here: they are the ones the most failure-sensitive
        # module is really executed by.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Belt and braces for invariant I2 (no network calls). Tier 3
      # (src/privacy_hud/detect/model.py) imports transformers inside a
      # try/except and degrades to available = False, so the suite is green
      # without the model -- this makes sure a future change cannot quietly
      # start pulling weights from the Hub instead of taking that path.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the `test` extra. The `detectors` extra (torch + transformers) is
      # deliberately left out: the suite passes without it -- the one tier-3
      # test that needs real weights is already @pytest.mark.slow and skips --
      # and installing it would trade a ~5s job for a multi-minute one that
      # also wants network access we do not want CI to have.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

  commit-messages:
    # CLAUDE.md section 1 forbids AI attribution trailers. Until now that was
    # enforced only by .githooks/commit-msg, which is opt-in per clone and does
    # nothing for outside contributors. This applies the same rule server-side.
    name: commit messages
    # Pull requests only: on a push to main the commits are already merged, so
    # there is no range to gate and failing here would just be noise.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the merge base with the base branch is reachable.
          fetch-depth: 0

      - name: Reject attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Compare against the merge base rather than the base branch tip, so
          # a PR that has merged main back into itself is not blamed for
          # commits it did not author.
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          failed=0
          # --no-merges: merge commit messages are generated by git and GitHub,
          # not by the contributor, and GitHub's own merge commits are not
          # something a PR author can rewrite.
          for sha in $(git rev-list --no-merges "$base..$HEAD_SHA"); do
            # Byte-for-byte the pattern from .githooks/commit-msg. Keep the two
            # in sync: a rule that rejects locally but passes in CI (or the
            # reverse) is worse than either rule alone.
            #
            # Scoped to AI attribution, not co-authorship in general: a
            # `Co-authored-by:` naming a human is legitimate and is how
            # pair-programmed contributions get credited. See the hook for the
            # full rationale and the known substring caveat.
            if git log -1 --format='%B' "$sha" \
                 | grep -qiE '^(assisted-by|generated-by|claude-session):|^co-authored-by:.*(claude|gpt|copilot|codex|noreply@anthropic)|generated with \[?claude code'; then
              subject="$(git log -1 --format='%s' "$sha")"
              echo "::error::${sha}: attribution trailer detected in \"${subject}\" — remove it (see CLAUDE.md section 1)."
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Rewrite the offending commit messages (git rebase -i) and force-push the branch." >&2
            exit 1
          fi

          echo "No attribution trailers found in $(git rev-list --no-merges --count "$base..$HEAD_SHA") commit(s)."
