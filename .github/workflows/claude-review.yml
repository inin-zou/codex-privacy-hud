name: Claude review

# Claude reads every non-draft pull request and leaves one review comment,
# with inline notes where a finding has a line. It is advisory: it is not a
# required check, it never approves or requests changes, and it never pushes.
#
# It needs one repository secret, CLAUDE_CODE_OAUTH_TOKEN: a Claude Code
# OAuth token, so the reviews draw on the maintainer's Claude subscription
# rather than on API billing. Without it the review job is skipped, not
# failed, so a fork or a fresh clone gets a quiet PR rather than a red one.
# Generate the token and store it with:
#
#   claude setup-token
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo <owner>/<repo>
#
# To bill an API key instead, replace `claude_code_oauth_token` below with
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` and check that secret
# in the gate job.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # `secrets` cannot be read in a job-level `if`, so a one-step job turns
    # the secret's presence into an output the review job can test.
    name: has key
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  review:
    name: review
    needs: gate
    if: needs.gate.outputs.present == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the
            description with `gh pr view ${{ github.event.pull_request.number }}`. Read any
            file the diff touches in full when the change depends on its surroundings.

            This is a privacy tool for the Codex CLI. Its correctness claims are stronger
            than a normal plugin's, so review against these first, in this order:

            1. Nothing that could contain user content (prompt text, file contents, tool
               arguments, exception messages, paths under a home directory) may be written
               to a log, a snapshot file, the ledger, or a status line. The ledger holds
               metadata only. Flag any new string that flows from an input to a sink.
            2. The runtime opens no socket other than its own on 127.0.0.1 and makes no
               outbound network call. Flag any new import or call that could.
            3. The percentage shown anywhere is the ledger's number verbatim. No renderer
               may round, clamp, or invent a number. When a reading is unavailable the
               output is empty, never 0 and never a stale value presented as current.
            4. A hook must never fail because the HUD or status-line publisher failed.
               Any exception on that path is caught and logged by class name only.
            5. The marker `⚠unverified` has exactly one meaning: the ledger holds
               evidence that this session's record has a gap. Flag any new use of it for
               anything else, and any new text that softens a known limit in README.md.
            6. `install.sh` must never modify the user's official Codex binary, and every
               file it creates must be recorded so `--uninstall` can remove it.

            Then the ordinary review: bugs, unhandled edge cases, tests that do not test
            what their name says, README text that promises something the code does not
            do, and commit messages that carry attribution trailers (Co-Authored-By,
            Generated with, session links), which this repository forbids.

            Report only findings you are confident about, most severe first, each with
            the file and line and a one-sentence reason. Put a finding that maps to a
            specific line as an inline comment. Then post the summary as one PR comment
            by running `gh pr comment ${{ github.event.pull_request.number }} --body "..."`;
            this step is mandatory. A review that ends without that comment has not
            finished.

            The summary has exactly two sections, in this order, in GitHub markdown:

            **Findings** — the findings as a numbered list, or the single line
            `Nothing to report.`

            **Checked** — what this review actually looked at, so that "nothing to
            report" can be told apart from "nothing was examined". One bullet per
            numbered check 1-6 above, each either naming the files or functions in the
            diff it was checked against (for example `1 (no user content to sinks):
            checked the new log call in daemon.py`) or saying `not touched by this
            diff`. Then one bullet listing the files read in full beyond the diff, and
            one bullet naming anything you could not check and why (a file too large, a
            tool call that was not allowed); write `none` if there was nothing. Keep
            each bullet to one line. Never list a check as done that you did not do.

            Do not restate the diff, do not praise, do not approve or request changes,
            and do not push commits.
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Grep,Glob"

      # The action prints only its first and last message, so a review that
      # ends without its comment leaves no evidence of which tool call was
      # refused. The execution log names every denial. It records the review's
      # own reasoning about this repository's diff, nothing from a user's
      # machine, and it expires after three days.
      - name: Upload the review execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-${{ github.event.pull_request.number }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: error
          retention-days: 3

      # A review that ends without its comment used to leave a green check and
      # nothing else: the last two pull requests went unreviewed and unnoticed.
      # This reads the log the action wrote and says so on the pull request,
      # naming only the counts and the refused tool names.
      - name: Report a review that posted nothing
        # Not `always()`: this workflow cancels its own in-progress run on
        # every new commit, and a superseded run is not a silent review.
        if: (success() || failure()) && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - "$LOG" > notice.md <<'PY'
          import json, sys

          # The log this action writes is one JSON array; a stream-json
          # transcript is one object per line. Read either, and never let
          # the shape of the evidence decide whether a review is reported.
          text = open(sys.argv[1]).read()
          try:
              messages = json.loads(text)
          except json.JSONDecodeError:
              messages = [json.loads(line) for line in text.splitlines() if line.strip()]
          if isinstance(messages, dict):
              messages = [messages]


          def calls(message):
              """The tool calls in one message, whatever else it holds.

              A message, its inner message and its content are each a
              dict, a bare string or absent, and a block is only a tool
              call when it says so.
              """
              if not isinstance(message, dict):
                  return
              inner = message.get("message")
              if not isinstance(inner, dict):
                  return
              content = inner.get("content")
              if not isinstance(content, list):
                  return
              for block in content:
                  if isinstance(block, dict) and block.get("type") == "tool_use":
                      yield block


          def results(message):
              """Every content block of one message, guarded the same way."""
              if not isinstance(message, dict):
                  return
              inner = message.get("message")
              if not isinstance(inner, dict):
                  return
              content = inner.get("content")
              if isinstance(content, list):
                  for block in content:
                      if isinstance(block, dict):
                          yield block


          # An attempt is not a result: a `gh pr comment` that failed on a
          # bad token or a closed pull request would otherwise count as
          # posted, and reproduce the silence this step exists to catch.
          attempted = {
              call.get("id")
              for message in messages for call in calls(message)
              if "gh pr comment" in str(
                  (call.get("input") or {}).get("command", ""))}
          posted = any(
              block.get("type") == "tool_result"
              and block.get("tool_use_id") in attempted
              and not block.get("is_error")
              for message in messages
              for block in results(message))
          result = next(
              (m for m in messages
               if isinstance(m, dict) and m.get("type") == "result"), {})
          if posted:
              sys.exit(0)
          denied = sorted({
              d.get("tool_name", "?")
              for d in (result.get("permission_denials") or [])})
          print("**This review posted no findings.**")
          print()
          print(f"It ran {result.get('num_turns', '?')} turns and "
                f"{len(result.get('permission_denials') or [])} tool calls were "
                f"refused ({', '.join(denied) or 'none'}). Read this pull "
                "request yourself: nothing here says the diff is sound.")
          PY
          if [ ! -s notice.md ]; then exit 0; fi
          # One notice per pull request, edited in place, the way the review's
          # own comment is sticky: a denial that repeats across pushes must not
          # bury the pull request in copies of the same sentence.
          printf '\n<!-- claude-review-silence -->\n' >> notice.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq 'map(select(.body | contains("<!-- claude-review-silence -->")))
                  | last | .id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@notice.md > /dev/null
          else
            gh pr comment "$PR" --body-file notice.md
          fi
