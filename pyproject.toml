[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-hud"
version = "0.1.0"
description = "Local-first privacy plugin for the Codex CLI: a session-level disclosure ledger with upstream enforcement."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
# The Level 1 ambient HUD: a standalone reader you run yourself in a second
# terminal pane. It polls $PLUGIN_DATA/ledger.db read-only and redraws one
# line in place -- it is not a Codex status item and does not render inside
# the Codex TUI. See src/privacy_hud/ambient.py.
privacy-hud-ambient = "privacy_hud.ambient:main"
# One-shot health check for the whole setup. Every moving part of this plugin
# fails silently -- an unstarted daemon, a PLUGIN_DATA the daemon and the hook
# client disagree on, missing model weights, a stale copy in Codex's plugin
# cache -- and all of them look identical to the user: "nothing happened".
# Exits 0 when the setup is usable (warnings included), 1 only when something
# is genuinely broken. See src/privacy_hud/doctor.py.
privacy-hud-doctor = "privacy_hud.doctor:main"

[project.optional-dependencies]
test = ["pytest>=8"]
# Floors, not decoration. A bare `transformers` let an incompatible pair get
# installed during development and cost hours: < 5.16 does not recognize the
# `openai_privacy_filter` architecture at all, and transformers itself declares
# torch>=2.5 (torch is one of ITS extras, so it is never pulled in
# transitively -- naming it here is what makes `pip install .[detectors]`
# actually produce a working tier 3 rather than a silently model-less one).
detectors = ["transformers>=5.16", "torch>=2.5"]
# Only needed to run mcp/server.py (the stdio MCP wrapper, Task 13). Not a
# hard dependency of the daemon, the hook client, or any pure privacy_hud
# module -- see mcp/server.py's own docstring for the tradeoff.
mcp = ["mcp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privacy_hud.matrix" = ["tables.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
