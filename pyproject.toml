[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-hud"
version = "0.1.0"
description = "Local-first privacy plugin for the Codex CLI: a session-level disclosure ledger with upstream enforcement."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
detectors = ["transformers"]
# Only needed to run mcp/server.py (the stdio MCP wrapper, Task 13). Not a
# hard dependency of the daemon, the hook client, or any pure privacy_hud
# module -- see mcp/server.py's own docstring for the tradeoff.
mcp = ["mcp"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privacy_hud.matrix" = ["tables.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
