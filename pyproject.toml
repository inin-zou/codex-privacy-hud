[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-hud"
version = "0.10.1"
description = "Local-first privacy plugin for the Codex CLI: a session-level disclosure ledger with upstream enforcement."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
# The Level 1 ambient HUD: a standalone reader you run yourself in a second
# terminal pane. It polls $PLUGIN_DATA/hud/<session_id>.json (contract A,
# src/privacy_hud/hud_snapshot.py) and redraws one line in place -- it is the
# fallback when no patched Codex build matches the installed version, and
# does not render inside the Codex TUI. See src/privacy_hud/ambient.py.
privacy-hud-ambient = "privacy_hud.ambient:main"
# One-shot health check for the whole setup. Every moving part of this plugin
# fails silently -- an unstarted daemon, a PLUGIN_DATA the daemon and the hook
# client disagree on, missing model weights, a stale copy in Codex's plugin
# cache -- and all of them look identical to the user: "nothing happened".
# Exits 0 when the setup is usable (warnings included), 1 only when something
# is genuinely broken. See src/privacy_hud/doctor.py.
privacy-hud-doctor = "privacy_hud.doctor:main"
# One-time setup: records which interpreter the daemon must be spawned with,
# into the plugin-data directory Codex assigns. Must be run from the
# environment that has transformers and torch -- hooks run against Codex's
# minimal PATH, where `python3` is usually a system interpreter with no
# transformers, and a daemon started there has no tier 3 and says nothing
# about it. Without this receipt the hook client will not start a daemon at
# all. See src/privacy_hud/runtime.py.
privacy-hud-setup = "privacy_hud.runtime:main"

[project.optional-dependencies]
# PyYAML is here because two tests parse the release workflows to pin them
# against install.sh. They used `pytest.importorskip("yaml")`, PyYAML was not
# installed by `pip install -e ".[test]"`, and so they skipped on every CI
# run -- checks that could not fail, guarding the workflows whose own check
# could not fail. Declare the dependency and import it plainly: a missing
# PyYAML must be a collection error, never a quiet skip.
# `mcp` is here for the same reason PyYAML is, and it cost more. The MCP
# surface tests guarded `build_app()` behind `pytest.importorskip`, the SDK
# was in no dependency group CI installs, so they skipped on every CI run --
# and when SDK 2.0 renamed the class the server imports, the two tests that
# would have caught it skipped with the reason "the MCP SDK is an optional
# extra", which by then was false: the SDK was installed, and our code did
# not work with it. Declared here, imported plainly, so an SDK our code
# cannot drive is a failure rather than a skip.
test = ["pytest>=8", "pyyaml>=6", "mcp>=2"]
# Floors, not decoration. A bare `transformers` let an incompatible pair get
# installed during development and cost hours: < 5.16 does not recognize the
# `openai_privacy_filter` architecture at all, and transformers itself declares
# torch>=2.5 (torch is one of ITS extras, so it is never pulled in
# transitively -- naming it here is what makes `pip install .[detectors]`
# actually produce a working tier 3 rather than a silently model-less one).
detectors = ["transformers>=5.16", "torch>=2.5"]
# Only needed to run mcp/server.py (the stdio MCP wrapper, Task 13). Not a
# hard dependency of the daemon, the hook client, or any pure privacy_hud
# module -- see mcp/server.py's own docstring for the tradeoff.
#
# The bound is the whole point, and its absence was a real outage. SDK 2.0
# renamed `FastMCP` to `MCPServer` and left `mcp.server.fastmcp` as a module
# that raises on import. With a bare `mcp`, which side of that rename an
# install landed on depended on the date: a venv built 2026-09-15 got 1.x and
# started, the same install.sh on 2026-09-20 got 2.2.0 and the server never
# started -- silently, since Codex reports nothing when an MCP server fails
# to launch. Same lesson as `detectors` above, ten lines down.
mcp = ["mcp>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privacy_hud.matrix" = ["tables.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = [
    # Line length is not enforced anywhere else (no formatter), and the long
    # lines are docstrings, assertion messages and fixture literals.
    "E501",
    # Semicolons are used deliberately in tests to keep one-object fixture
    # setup (`d = tmp / "x"; d.mkdir()`) on one line; no bug class hides here.
    "E702",
]

[tool.mypy]
# The floor from requires-python, so 3.12-only syntax fails here rather than
# on a user's 3.11. `files` makes a bare `mypy` check what CI checks.
python_version = "3.11"
files = ["src"]

# The `detectors` extra, which the typecheck job does not install (see
# ci.yml). Without this mypy's verdict would depend on whether the machine
# running it happens to have transformers.
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true
